org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.configuration-cache=false
loom.ignoreDependencyLoomVersionValidation=true
# Fabric Language Kotlin (which PolyCompose needs) provides the Kotlin stdlib; ClientTag only uses
# Kotlin when PolyCompose is loaded.
kotlin.stdlib.default.dependency=false

# Which Minecraft versions to build: "all", or a comma-separated subset such as
#   clienttag.versions=1.8.9,1.21.11
# Can also be passed on the command line: ./gradlew buildAll -Pclienttag.versions=1.8.9
clienttag.versions=all
